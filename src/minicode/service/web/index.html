<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minicode</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="./assets/index-Fbmw1rHl.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BFrQVWMk.css">
  </head>
  <body>
    <div class="app" id="appRoot">
      <!-- 左栏：工作区 + 会话列表 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">m</span>
          <span>minicode</span>
        </div>

        <div class="workspace">
          <div class="workspace-head">
            <label for="workspace">工作区</label>
            <button id="refreshWs" class="icon" title="刷新工作区列表">↻</button>
          </div>
          <select id="workspace"></select>
          <input id="workspaceCustom" class="custom" placeholder="或输入自定义路径" />
        </div>

        <div class="token-row">
          <label for="token">令牌</label>
          <input id="token" class="custom" type="password" placeholder="服务端设了才需要" autocomplete="off" />
        </div>

        <button id="newChat" class="new-chat">＋ 新会话</button>

        <nav id="conversations" class="conversations" aria-label="历史会话">
          <p class="muted hint">暂无会话</p>
        </nav>

        <footer class="sidebar-foot">
          <span id="storeInfo" class="muted"></span>
        </footer>
      </aside>

      <!-- 主区：导航栏切换「对话 / 轨迹」 -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <span id="title">新会话</span>
            <span id="runStatus" class="badge" role="status" aria-live="polite" hidden></span>
          </div>
          <div class="topbar-right">
            <div class="view-switch" role="tablist" aria-label="视图切换">
              <button id="viewChat" class="view-tab active" role="tab" aria-selected="true">对话</button>
              <button id="viewTrajectory" class="view-tab" role="tab" aria-selected="false">轨迹</button>
            </div>
            <div id="usage" class="usage muted"></div>
          </div>
        </header>

        <section id="chat" class="chat">
          <div class="empty" id="empty">
            <p class="empty-title">新建任务</p>
            <p class="muted">在下方输入任务，或从左侧选择历史会话。</p>
            <div class="examples">
              <button class="example" data-task="统计 src 目录下的 Python 文件数量">统计 src 目录下的 Python 文件数量</button>
              <button class="example" data-task="阅读 README，用三句话总结这个项目">用三句话总结这个项目</button>
              <button class="example" data-task="找出测试覆盖率最低的模块">找出覆盖率最低的模块</button>
            </div>
          </div>
        </section>

        <section class="composer">
          <div class="options" id="options">
            <select id="model" title="模型">
              <option value="">默认模型</option>
              <option value="deepseek-flash">deepseek-flash</option>
              <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
            <span class="divider"></span>
            <label class="check"><input id="optFiles" type="checkbox" checked /> 文件工具</label>
            <label class="check"><input id="optPlan" type="checkbox" checked /> 计划</label>
            <label class="check"><input id="optSkills" type="checkbox" checked /> 技能</label>
            <label class="check"><input id="optCompact" type="checkbox" checked /> 压缩</label>
            <label class="check"><input id="optTasks" type="checkbox" checked /> 任务图</label>
            <label class="check"><input id="optMemory" type="checkbox" checked /> 记忆</label>
            <label class="check"><input id="optMcp" type="checkbox" /> MCP</label>
          </div>
          <div class="input-row">
            <label for="task" class="sr-only">任务内容</label>
            <textarea id="task" rows="2" placeholder="输入任务描述，Ctrl+Enter 发送"></textarea>
            <button id="submit">发送</button>
          </div>
          <div class="composer-foot">
            <span id="status" class="muted" role="status" aria-live="polite"></span>
            <button id="cancel" class="link" hidden>停止执行</button>
            <button id="resume" class="link" hidden>继续执行</button>
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
