<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minicode</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="./assets/index-Db-lPvn_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DQI2gQfY.css">
  </head>
  <body>
    <div class="app">
      <!-- 左栏：工作区 + 会话列表 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">m</span>
          <span>minicode</span>
        </div>

        <div class="workspace">
          <div class="workspace-head">
            <label for="workspace">工作区</label>
            <button id="refreshWs" class="icon" title="刷新工作区列表">↻</button>
          </div>
          <select id="workspace"></select>
          <input id="workspaceCustom" class="custom" placeholder="或填一个路径…" />
        </div>

        <button id="newChat" class="new-chat">＋ 新会话</button>

        <nav id="conversations" class="conversations" aria-label="历史会话">
          <p class="muted hint">还没有会话</p>
        </nav>

        <footer class="sidebar-foot">
          <span id="storeInfo" class="muted"></span>
        </footer>
      </aside>

      <!-- 右侧：对话主区 -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <span id="title">新会话</span>
            <span id="runStatus" class="badge" role="status" aria-live="polite" hidden></span>
          </div>
          <div id="usage" class="usage muted"></div>
        </header>

        <section id="chat" class="chat">
          <div class="empty" id="empty">
            <p class="empty-title">开始一个新任务</p>
            <p class="muted">在下面输入，或者在左侧选一个历史会话。</p>
            <div class="examples">
              <button class="example" data-task="数一下 src 下有多少 py 文件">数一下 src 下有多少 py 文件</button>
              <button class="example" data-task="看一下 README，用三句话总结这个项目">用三句话总结这个项目</button>
              <button class="example" data-task="找出 tests 里覆盖最少的一个模块">找出覆盖最少的模块</button>
            </div>
          </div>
        </section>

        <section class="composer">
          <div class="options" id="options">
            <select id="model" title="模型">
              <option value="">默认模型</option>
              <option value="deepseek-flash">deepseek-flash</option>
              <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
            <label title="最大步数">步数<input id="maxSteps" type="number" min="1" max="50" value="8" /></label>
            <span class="divider"></span>
            <label class="check"><input id="optFiles" type="checkbox" /> 文件工具</label>
            <label class="check"><input id="optPlan" type="checkbox" /> 计划</label>
            <label class="check"><input id="optSkills" type="checkbox" /> 技能</label>
            <label class="check"><input id="optCompact" type="checkbox" /> 压缩</label>
            <label class="check"><input id="optTasks" type="checkbox" /> 任务图</label>
          </div>
          <div class="input-row">
            <label for="task" class="sr-only">任务内容</label>
            <textarea id="task" rows="2" placeholder="描述任务，Ctrl+Enter 发送"></textarea>
            <button id="submit">发送</button>
          </div>
          <div class="composer-foot">
            <span id="status" class="muted" role="status" aria-live="polite"></span>
            <button id="resume" class="link" hidden>继续跑</button>
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
